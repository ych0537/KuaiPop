<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#2346B5"/>
    </linearGradient>
    <radialGradient id="bub" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#DDEBFF" stop-opacity="0.22"/>
      <stop offset="0.9" stop-color="#BFD8FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#A9F0FF"/>
      <stop offset="1" stop-color="#FFD3F0"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <circle cx="820" cy="860" r="220" fill="#FFFFFF" opacity="0.06"/>
    <circle cx="190" cy="180" r="160" fill="#FFFFFF" opacity="0.06"/>
  </g>

  <!-- main bubble -->
  <g>
    <circle cx="470" cy="540" r="250" fill="url(#bub)"/>
    <circle cx="470" cy="540" r="250" fill="none" stroke="url(#rim)" stroke-width="14"/>
    <path d="M330 430 A 170 170 0 0 1 450 350" stroke="#FFFFFF" stroke-width="30" fill="none" stroke-linecap="round"/>
    <circle cx="322" cy="482" r="16" fill="#FFFFFF"/>
  </g>

  <!-- medium bubble -->
  <g>
    <circle cx="745" cy="330" r="100" fill="url(#bub)"/>
    <circle cx="745" cy="330" r="100" fill="none" stroke="url(#rim)" stroke-width="10"/>
    <path d="M690 296 A 64 64 0 0 1 738 262" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <!-- small bubble -->
  <g>
    <circle cx="790" cy="620" r="46" fill="url(#bub)"/>
    <circle cx="790" cy="620" r="46" fill="none" stroke="url(#rim)" stroke-width="7"/>
    <path d="M766 604 A 28 28 0 0 1 786 590" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- popping bubble: burst lines -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.95">
    <line x1="292" y1="228" x2="268" y2="196"/>
    <line x1="330" y1="214" x2="334" y2="176"/>
    <line x1="364" y1="234" x2="392" y2="210"/>
    <line x1="276" y1="268" x2="240" y2="262"/>
  </g>
  <circle cx="318" cy="262" r="14" fill="#FFFFFF" opacity="0.95"/>
</svg>
